<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Logo Intro</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0a0a0f; font-family: "Inter", sans-serif; }
      .center { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 24px; }
      .logo { font-size: 80px; font-weight: 900; color: #6366f1; opacity: 0; letter-spacing: -0.03em; }
      .tagline { font-size: 28px; font-weight: 400; color: rgba(255,255,255,0.5); opacity: 0; }
      .bar { width: 0; height: 4px; background: #6366f1; border-radius: 2px; }
    </style>
  </head>
  <body>
    <div class="center">
      <div class="logo" id="logo">HeyJoe AI</div>
      <div class="bar" id="bar"></div>
      <div class="tagline" id="tagline">AI-powered video production</div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ id: "scene1-logo-intro", paused: true });
      tl.to("#logo", { opacity: 1, duration: 0.5, ease: "power2.out" }, 0);
      tl.to("#bar", { width: 200, duration: 0.6, ease: "power2.inOut" }, 0.3);
      tl.to("#tagline", { opacity: 1, duration: 0.4, ease: "power2.out" }, 0.8);
      tl.to(".center", { opacity: 0, duration: 0.3, ease: "power2.in" }, 1.2);
      window.__timelines["scene1-logo-intro"] = tl;
    </script>
  </body>
</html>
